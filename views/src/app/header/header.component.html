<div class="header">
    <div class="left">
        <a class="logo" routerLink="/" routerLinkActive="active" ariaCurrentWhenActive="page"></a>
    </div>

    <div *ngIf="isNotLogin" class="right">
        <button class="btn btn-small btn-yellow btn-book" routerLink="/book/new" routerLinkActive="active">
            <fa-icon [icon]="faPlus"></fa-icon> Create
        </button>

        <input class="search" type="text" placeholder="search">

        <div class="me-container" *ngIf="profile">
            <div class="me-profile">
                <span *ngIf="!profile?.src">A</span>
            </div>
        </div>

        <a *ngIf="!profile" class="login-link" routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Login</a>
    </div>
</div>
